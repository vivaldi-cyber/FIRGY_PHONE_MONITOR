<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIRGY PHONE MONITOR</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="wrap"><header><div><p class="eyebrow">DEVICE COMPANION</p><h1>FIRGY PHONE MONITOR</h1><p class="muted">Dashboard pemantauan perangkat Android dengan izin pemilik.</p></div><span id="status" class="pill">Belum login</span></header>
<section id="auth" class="panel"><h2>Masuk / Daftar</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (min. 10 karakter)"><div class="actions"><button id="register">Daftar</button><button id="login" class="secondary">Masuk</button></div><p id="authMsg" class="muted"></p></section>
<section id="app" hidden><section class="panel"><div class="row"><h2>Perangkat</h2><button id="pair">Buat kode pairing</button></div><p id="pairCode" class="code"></p><p class="muted">Kode berlaku 10 menit. Masukkan di aplikasi Android yang dipasang dan dikendalikan secara terbuka.</p></section><div id="devices"></div><button id="refresh" class="secondary">Perbarui data</button><button id="logout" class="danger">Keluar</button></section>
<footer>FIRGY PHONE MONITOR · Gunakan HTTPS untuk akses internet.</footer></main><script src="/static/app.js"></script></body></html>
